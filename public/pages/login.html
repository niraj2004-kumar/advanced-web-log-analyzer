<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Log Analyzer - Sign In</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <div class="login-container">
        <!-- Animated Background -->
        <div class="background-elements">
            <div class="blob blob-1"></div>
            <div class="blob blob-2"></div>
            <div class="blob blob-3"></div>
        </div>

        <div class="container-fluid h-100">
            <div class="row h-100 g-0">
                <!-- Hero Section -->
                <div class="col-lg-6 hero-section d-flex flex-column justify-content-center align-items-center px-4">
                    <div class="hero-content text-center">
                        <div class="badge bg-gradient mb-4">
                            <span>WEB LOG ANALYZER</span>
                        </div>
                        <h1 class="hero-title mb-3">
                            Advanced Log Analytics Platform
                        </h1>
                        <p class="hero-subtitle">
                            Analyze, monitor, and optimize your application logs with powerful insights and actionable intelligence.
                        </p>
                    </div>
                </div>

                <!-- Login Form Section -->
                <div class="col-lg-6 form-section d-flex flex-column justify-content-center align-items-center px-4">
                    <div class="login-card">
                        <h2 class="form-title">Sign In</h2>
                        
                        <form id="loginForm" class="login-form">
                            <!-- Email Input -->
                            <div class="form-group mb-4">
                                <label for="email" class="form-label">Email Address</label>
                                <div class="input-wrapper">
                                    <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                                        <polyline points="22,6 12,13 2,6"></polyline>
                                    </svg>
                                    <input 
                                        type="email" 
                                        class="form-control" 
                                        id="email" 
                                        placeholder="Enter your email"
                                        required
                                    >
                                </div>
                                <div class="error-message" id="emailError"></div>
                            </div>

                            <!-- Password Input -->
                            <div class="form-group mb-4">
                                <label for="password" class="form-label">Password</label>
                                <div class="input-wrapper">
                                    <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                                    </svg>
                                    <input 
                                        type="password" 
                                        class="form-control" 
                                        id="password" 
                                        placeholder="Enter your password"
                                        required
                                    >
                                    <button type="button" class="toggle-password" id="togglePassword">
                                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                            <circle cx="12" cy="12" r="3"></circle>
                                        </svg>
                                    </button>
                                </div>
                                <div class="error-message" id="passwordError"></div>
                            </div>

                            <!-- Sign In Button -->
                            <button type="submit" class="btn btn-primary btn-signin w-100 mb-4">
                                <span class="btn-text">Sign In</span>
                                <span class="spinner-border spinner-border-sm d-none ms-2" id="btnSpinner"></span>
                            </button>
                        </form>

                        <!-- Sign Up Link -->
                        <p class="signup-prompt">
                            Don't have an account? 
                            <a href="#" class="signup-link">Create one</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../script/login.js"></script>
</body>
</html>
