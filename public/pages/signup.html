<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Web Log Analyzer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/signup.css">
</head>
<body>
    <div class="signup-container">
        <!-- Left Section -->
        <div class="signup-left">
            <div class="left-content">
                <div class="badge-glow">
                    <span class="badge-text">
                        <i class="fas fa-chart-line"></i> WEB LOG ANALYZER
                    </span>
                </div>
                <h1 class="left-heading">Build Your Analysis Workspace</h1>
                <p class="left-subtitle">Create an account to upload, analyze, and monitor structured traffic logs with real-time insights.</p>
                <div class="glow-line"></div>
            </div>
        </div>

        <!-- Right Section -->
        <div class="signup-right">
            <div class="signup-card">
                <h2 class="signup-title">Create Account</h2>
                
                <form id="signupForm" class="signup-form">
                    <!-- Username Field -->
                    <div class="form-group">
                        <label for="username" class="form-label">Username</label>
                        <div class="input-wrapper">
                            <i class="fas fa-user input-icon"></i>
                            <input 
                                type="text" 
                                id="username" 
                                class="form-control" 
                                placeholder="Choose your username"
                                required
                            >
                        </div>
                    </div>

                    <!-- Email Field -->
                    <div class="form-group">
                        <label for="email" class="form-label">Email Address</label>
                        <div class="input-wrapper">
                            <i class="fas fa-envelope input-icon"></i>
                            <input 
                                type="email" 
                                id="email" 
                                class="form-control" 
                                placeholder="your@email.com"
                                required
                            >
                        </div>
                    </div>

                    <!-- Password Field -->
                    <div class="form-group">
                        <label for="password" class="form-label">Password</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock input-icon"></i>
                            <input 
                                type="password" 
                                id="password" 
                                class="form-control" 
                                placeholder="Create a strong password"
                                required
                            >
                            <button type="button" class="toggle-password" data-target="password">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Confirm Password Field -->
                    <div class="form-group">
                        <label for="confirmPassword" class="form-label">Confirm Password</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock input-icon"></i>
                            <input 
                                type="password" 
                                id="confirmPassword" 
                                class="form-control" 
                                placeholder="Re-enter your password"
                                required
                            >
                            <button type="button" class="toggle-password" data-target="confirmPassword">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Sign Up Button -->
                    <button type="submit" class="btn-signup">
                        <span>Create Account</span>
                        <i class="fas fa-arrow-right"></i>
                    </button>
                </form>

                <!-- Sign In Link -->
                <div class="signin-link">
                    Already have an account? <a href="#signin">Sign in</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../script/signup.js"></script>
</body>
</html>
